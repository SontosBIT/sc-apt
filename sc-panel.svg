<svg xmlns="http://www.w3.org/2000/svg" width="600" height="600" viewBox="0 0 600 600">
  <title>Sc panel</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#47484c"/>
      <stop offset="1" stop-color="#202125"/>
    </linearGradient>
    <mask id="frame">
      <rect x="148" y="262" width="304" height="148" rx="36" fill="#fff"/>
      <rect x="165" y="288" width="78" height="96" rx="12" fill="#000"/>
      <rect x="261" y="288" width="78" height="96" rx="12" fill="#000"/>
      <rect x="357" y="288" width="78" height="96" rx="12" fill="#000"/>
    </mask>
  </defs>
  <rect width="600" height="600" rx="140" fill="url(#bg)"/>
  <rect x="1.5" y="1.5" width="597" height="597" rx="138.5" fill="none" stroke="#ffffff" stroke-opacity="0.09" stroke-width="3"/>
  <!-- the notch -->
  <rect x="235" y="177" width="130" height="46" rx="23" fill="#9b8dff"/>
  <!-- the panel with its three cards; media in the middle -->
  <rect x="148" y="262" width="304" height="148" rx="36" fill="#f2f2f2" mask="url(#frame)"/>
  <path d="M288 315 L323 336 L288 357 Z" fill="#9b8dff" stroke="#9b8dff" stroke-width="3" stroke-linejoin="round"/>
</svg>
